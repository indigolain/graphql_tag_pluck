name: Release

# When a change to GraphqlTagPluck::VERSION lands on main, tag the commit as
# vX.Y.Z and publish that version to RubyGems.org.
#
# Tagging and publishing live in one workflow on purpose: tags pushed with
# GITHUB_TOKEN do not trigger other workflows, and RubyGems trusted
# publishing is registered against this single workflow file.
#
# Run it manually (Actions > Release > Run workflow) to retry a failed
# publish; an existing tag is reused.
on:
  push:
    branches:
      - main
    paths:
      - lib/graphql_tag_pluck/version.rb
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    if: github.repository == 'indigolain/graphql_tag_pluck'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      created: ${{ steps.tag.outputs.created }}

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Read gem version
      id: version
      run: |
        version=$(sed -n 's/^ *VERSION = "\(.*\)"$/\1/p' lib/graphql_tag_pluck/version.rb)
        if [ -z "$version" ]; then
          echo "::error::Could not read VERSION from lib/graphql_tag_pluck/version.rb"
          exit 1
        fi
        echo "tag=v$version" >> "$GITHUB_OUTPUT"
    - name: Create tag if it does not exist
      id: tag
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ steps.version.outputs.tag }}
      run: |
        if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --silent 2>/dev/null; then
          echo "Tag $TAG already exists; not creating it"
          echo "created=false" >> "$GITHUB_OUTPUT"
        else
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" --silent
          echo "Created tag $TAG at $GITHUB_SHA"
          echo "created=true" >> "$GITHUB_OUTPUT"
        fi

  release:
    needs: tag
    # Publish when a new tag was just created, or when retried manually.
    if: needs.tag.outputs.created == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: rubygems.org
      url: https://rubygems.org/gems/graphql_tag_pluck
    permissions:
      contents: write
      id-token: write

    steps:
    - uses: actions/checkout@v4
      with:
        ref: refs/tags/${{ needs.tag.outputs.tag }}
        persist-credentials: false
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.4'
        bundler-cache: true
    - name: Run specs
      run: bundle exec rake spec
    - name: Publish to RubyGems.org
      uses: rubygems/release-gem@v1
